<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Report an Issue</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --bg: #ffffff;
        --muted: #666666;
        --border: #cccccc;
        --accent: #128c7e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6e6e6;
          --bg: #1e1e1e;
          --muted: #a0a0a0;
          --border: #444444;
          --accent: #25d366;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        flex-direction: column;
        gap: 10px;
        height: 100vh;
      }
      h1 {
        font-size: 15px;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
      }
      textarea {
        flex: 1;
        resize: none;
        font-family: inherit;
        font-size: 13px;
        padding: 8px;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
      }
      #status {
        font-size: 12px;
        color: var(--muted);
        margin-right: auto;
      }
      button {
        font-size: 13px;
        padding: 6px 14px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #ffffff;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Report an Issue</h1>
    <p>
      Describe what went wrong. The app's log file is included automatically.
      Close this window to cancel.
    </p>
    <textarea id="description" placeholder="What were you doing when the problem happened?"></textarea>
    <div class="actions">
      <span id="status"></span>
      <button id="send">Send Report</button>
    </div>
    <script>
      var sendButton = document.getElementById("send");
      var statusEl = document.getElementById("status");

      function fail(error) {
        console.error("Report an Issue:", error);
        statusEl.textContent = "Failed to send report: " + error;
        sendButton.disabled = false;
        window.alert("Failed to send report: " + error);
      }

      sendButton.addEventListener("click", function () {
        try {
          var description = document.getElementById("description").value;
          sendButton.disabled = true;
          statusEl.textContent = "Opening your mail client…";

          window.__TAURI_INTERNALS__.invoke("submit_report", { description: description }).catch(fail);
        } catch (error) {
          fail(error);
        }
      });
    </script>
  </body>
</html>
