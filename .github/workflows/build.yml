name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils pacman-package-manager libarchive-tools
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Build Tauri Packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          uploadWorkflowArtifacts: true
      - name: Build Arch Linux package
        run: make arch-bundle
      - name: Upload Arch Linux Package
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-arch
          path: target/release/bundle/arch/*.pkg.tar.zst
      - name: Upload Arch package to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/bundle/arch/*.pkg.tar.zst
      - name: Install Fury CLI
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "Types: deb
          URIs: https://apt.fury.io/cli/
          Suites: /
          Trusted: yes" | sudo tee /etc/apt/sources.list.d/fury-cli.sources > /dev/null
          sudo apt update
          sudo apt install -y gemfury
      - name: Publish to Gemfury
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        run: |
          shopt -s nullglob
          for file in target/release/bundle/{deb/*.deb,rpm/*.rpm,arch/*.pkg.tar.zst}; do
            fury push "$file" --api-token="$GEMFURY_TOKEN" --public --quiet
          done
      - name: Remove old Arch Linux packages from Gemfury
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GEMFURY_TOKEN: ${{ secrets.GEMFURY_TOKEN }}
        run: |
          fury versions alpm:whatsapp-desktop --api-token=$GEMFURY_TOKEN \
            | awk -v cur="${GITHUB_REF_NAME#v}-1" '$1 ~ /^[0-9]/ && $1 != cur {print $1}' \
            | xargs -r -I{} fury yank alpm:whatsapp-desktop -v {} --api-token=$GEMFURY_TOKEN -f || true
